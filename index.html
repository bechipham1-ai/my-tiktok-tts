<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bèo Control 🌸 PK Master V4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');
        :root { --primary: #ff85a2; --bg: #fff5f7; --border: #f8bbd0; }
        body { font-family: 'Quicksand', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }
        
        .left-side { width: 330px; border-right: 2px solid var(--border); background: #fff; display: flex; flex-direction: column; padding: 15px; }
        .right-side { flex: 1; padding: 15px; overflow-y: auto; }
        
        .box-conn { background: #fff; border: 2px solid var(--border); padding: 12px; border-radius: 18px; margin-bottom: 10px; }
        .msg { padding: 8px 12px; background: #fff; border-left: 4px solid var(--primary); margin-bottom: 6px; border-radius: 8px; font-size: 13px; }
        input, button { padding: 10px; border-radius: 10px; border: 2px solid var(--border); width: 100%; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="left-side">
    <h3>Bèo Control 🌸</h3>
    <div class="box-conn">
        <input type="text" id="user" placeholder="Nhập ID TikTok...">
        <button onclick="start()">KẾT NỐI</button>
        <div id="stt-text">Trạng thái: Đang chờ...</div>
    </div>
    <div>ÂL: <span id="al-date">...</span> | Follows: <span id="follow-count">0</span></div>
    <label>Tốc độ: <input type="range" min="0.5" max="2.0" step="0.1" value="1.2" oninput="changeSpeed(this.value)"></label>
</div>
<div class="right-side" id="chat"></div>

<script>
    const socket = io();
    let queue = [], playing = false, currentSpeed = 1.2, totalFollows = 0;

    function start() {
        const u = document.getElementById('user').value.trim();
        if(!u) return;
        socket.emit('set-username', u);
        document.getElementById('stt-text').innerText = "Đang kết nối...";
    }

    // Xử lý sự kiện từ server
    socket.on('status', m => {
        if(m.includes('✅')) {
            document.getElementById('stt-text').innerText = "Đã kết nối thành công";
            speak("Hệ thống đã sẵn sàng rồi Bèo ơi");
        }
    });

    socket.on('audio-data', d => {
        // Lọc Spam
        if (!d.comment || d.comment.length < 2) return;
        
        // Đếm Follow
        if (d.comment.toLowerCase().includes('đã follow') || d.comment.toLowerCase().includes('đã theo dõi')) {
            totalFollows++;
            document.getElementById('follow-count').innerText = totalFollows;
        }

        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<b>${d.user}:</b> ${d.comment}`;
        document.getElementById('chat').prepend(div);

        if (d.audio) { queue.push(d.audio); if (!playing) play(); }
    });

    // PK 20s
    socket.on('linkMicArmies', () => speak("20 giây cuối lên bông bèo ơi"));
    socket.on('match', () => speak("20 giây cuối lên bông bèo ơi"));

    // Hàm âm thanh
    function speak(text) {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=vi&client=tw-ob`;
        queue.push(url);
        if (!playing) play();
    }

    function play() {
        if (queue.length === 0) { playing = false; return; }
        playing = true;
        const audio = new Audio(queue.shift());
        audio.playbackRate = currentSpeed;
        audio.onended = () => setTimeout(play, 300);
        audio.play().catch(() => play());
    }

    function changeSpeed(v) { currentSpeed = parseFloat(v); }

    // Đồng hồ Âm lịch
    function updateClock() {
        const d = new Date(), tet = new Date(2026, 1, 17);
        const diff = Math.floor((d - tet) / 86400000);
        document.getElementById('al-date').innerText = ((diff % 30) + 1) + "/" + ((Math.floor(diff / 30) % 12) + 1);
    }
    setInterval(updateClock, 1000); updateClock();
</script>
</body>
</html>
