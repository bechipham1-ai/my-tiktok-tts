<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bèo Control 🌸 PK Master FIX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --primary: #ff85a2; --bg: #fff5f7; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .control-panel { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #f8bbd0; }
        .msg { padding: 5px; border-bottom: 1px solid #eee; font-size: 13px; }
    </style>
</head>
<body>

<div class="control-panel">
    <h3>Bèo Control 🌸</h3>
    <input type="text" id="user" placeholder="Nhập ID TikTok...">
    <button onclick="connect()">KẾT NỐI</button>
    <div id="stt-text">Trạng thái: Chưa kết nối</div>
    <hr>
    <div>ÂL: <span id="al-date">...</span> | Follows: <span id="follow-count">0</span></div>
    <label>Tốc độ: <input type="range" min="0.5" max="2.0" step="0.1" value="1.2" oninput="changeSpeed(this.value)"></label>
</div>
<div id="chat"></div>

<script>
    // Kiểm tra xem io đã tải chưa
    if (typeof io === 'undefined') {
        document.getElementById('stt-text').innerText = "Lỗi: Chưa tải được thư viện Socket!";
    }

    const socket = io(); // Kết nối tới server của Bèo
    let queue = [], playing = false, currentSpeed = 1.2, totalFollows = 0;

    function connect() {
        const u = document.getElementById('user').value.trim();
        if(!u) return;
        socket.emit('set-username', u);
        document.getElementById('stt-text').innerText = "Đang kết nối...";
    }

    socket.on('status', m => {
        if(m.includes('✅')) {
            document.getElementById('stt-text').innerText = "Đã kết nối thành công";
            speak("Hệ thống đã sẵn sàng");
        }
    });

    // Sự kiện PK 20s
    socket.on('linkMicArmies', () => speak("20 giây cuối lên bông bèo ơi"));
    socket.on('match', () => speak("20 giây cuối lên bông bèo ơi"));

    socket.on('audio-data', d => {
        if (d.comment && (d.comment.includes('đã follow') || d.comment.includes('đã theo dõi'))) {
            totalFollows++;
            document.getElementById('follow-count').innerText = totalFollows;
        }
        
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<b>${d.user}:</b> ${d.comment}`;
        document.getElementById('chat').prepend(div);

        if (d.audio) {
            queue.push(d.audio);
            if (!playing) play();
        }
    });

    function play() {
        if (queue.length === 0) { playing = false; return; }
        playing = true;
        const audio = new Audio(queue.shift());
        audio.playbackRate = currentSpeed;
        audio.onended = () => setTimeout(play, 300);
        audio.play().catch(() => play());
    }

    function speak(text) {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=vi&client=tw-ob`;
        queue.push(url);
        if (!playing) play();
    }

    function changeSpeed(v) { currentSpeed = parseFloat(v); }
</script>
</body>
</html>
