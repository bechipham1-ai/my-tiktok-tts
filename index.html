<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bèo Control 🌸</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #fff5f7; margin: 20px; }
        .box { background: white; padding: 20px; border-radius: 15px; border: 2px solid #f8bbd0; }
        .msg { padding: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="clock-date">Đang tải...</h2>
        <input type="text" id="user" placeholder="ID TikTok...">
        <button onclick="start()">KẾT NỐI</button>
        <div id="stt">Trạng thái: Sẵn sàng</div>
        <input type="range" min="0.5" max="2.0" step="0.1" value="1.2" oninput="currentSpeed=this.value">
        <div id="chat"></div>
    </div>

    <script>
        const socket = io();
        let queue = [], playing = false, currentSpeed = 1.2;

        function updateClock() {
            const now = new Date();
            const d = now.getDate(), m = now.getMonth() + 1, y = now.getFullYear();
            const tet = new Date(2026, 1, 17);
            const diff = Math.floor((now - tet) / 86400000);
            document.getElementById('clock-date').innerText = `DL: ${d}/${m}/${y} - ÂL: ${(diff % 30) + 1}/${(Math.floor(diff / 30) % 12) + 1}`;
        }
        setInterval(updateClock, 1000); updateClock();

        function start() { socket.emit('set-username', document.getElementById('user').value); }

        socket.on('status', m => document.getElementById('stt').innerText = m);

        socket.on('audio-data', d => {
            document.getElementById('chat').innerHTML = `<div class="msg"><b>${d.user}:</b> ${d.comment}</div>` + document.getElementById('chat').innerHTML;
            if (d.audio) { queue.push(d.audio); if (!playing) play(); }
        });

        function play() {
            if (!queue.length) { playing = false; return; }
            playing = true;
            const a = new Audio(queue.shift());
            a.playbackRate = currentSpeed;
            a.onended = () => setTimeout(play, 100);
            a.play().catch(() => play());
        }
    </script>
</body>
</html>
