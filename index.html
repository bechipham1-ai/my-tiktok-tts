<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bèo Control - Live</title>
    <script src="/socket.io/socket.io.js"></script>
    
    </head>
<body>

    <div id="app">
        </div>

    <script>
        // Khởi tạo kết nối Socket
        const socket = io(); 

        // Các tính năng JS của Bèo sẽ chạy bình thường sau dòng này
        // Vì io đã được định nghĩa từ file /socket.io/socket.io.js
        
        socket.on('connect', () => {
            console.log("Kết nối server thành công!");
        });

        // Bèo có thể dán tiếp toàn bộ logic JS cũ của Bèo vào dưới đây
        // Mình đảm bảo nó sẽ nhận diện được biến 'io'
    </script>
</body>
</html>
