<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bèo Control 🌸</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>
    <div id="chat"></div>
    <input type="text" id="user" placeholder="ID TikTok...">
    <button onclick="start()">KẾT NỐI</button>

    <script>
        const socket = io();
        let queue = [], playing = false;

        function start() {
            socket.emit('set-username', document.getElementById('user').value);
        }

        socket.on('audio-data', d => {
            // Hiển thị nhật ký
            const chat = document.getElementById('chat');
            chat.innerHTML = `<div><b>${d.user}:</b> ${d.comment}</div>` + chat.innerHTML;

            // Xử lý logic đọc âm thanh
            if (d.audio) {
                queue.push(d.audio);
                if (!playing) play();
            }
        });

        function play() {
            if (queue.length === 0) { playing = false; return; }
            playing = true;
            const a = new Audio(queue.shift());
            a.onended = () => setTimeout(play, 500);
            a.play().catch(() => play());
        }
    </script>
</body>
</html>
